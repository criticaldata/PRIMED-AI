[project]
name = "primed_ai"
version = "0.1.0"
description = "EchoJEPA + ECG-FM LVEF Estimation"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "hydra-core>=1.3.2"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pre-commit",
    "ruff"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"