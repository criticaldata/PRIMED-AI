[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "primed-ai"
version = "0.1.0"
description = "PRIMED-AI experiment configuration and reproducibility utilities"
requires-python = ">=3.10"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "numpy>=1.24",
    "torch>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]